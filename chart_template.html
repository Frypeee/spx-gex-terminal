<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root { --bg:#0a0f18; --fg:#d8e0ee; --muted:#8b97b1; --line:#1e2a3f; --btnbg:#101827; --btnfg:#aab6cf; --btnbd:#263451; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #wrap { position: relative; height: 100%; width: 100%; }
  #wrap { --top: 0px; --pw: 0px; }
  #chart { position: absolute; left: 0; top: var(--top); bottom: 0; right: var(--pw); }
  #side { position: absolute; top: var(--top); right: 0; bottom: 0; width: var(--pw); border-left: 1px solid var(--line); display: none; }
  #side canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #legend {
    position: absolute; left: 10px; top: calc(var(--top) + 8px); z-index: 5; pointer-events: none;
    font: 500 12px/1.5 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
    text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg);
  }
  #legend b { color: var(--fg); font-weight: 500; }
  #legend .t { font: 600 13px 'IBM Plex Sans', system-ui, sans-serif; color: var(--fg); margin-right: 8px; }
  #legend .up { color: #26a69a; } #legend .dn { color: #ef5350; }
  #tools { position: absolute; left: 10px; bottom: 44px; z-index: 6; display: flex; gap: 6px; align-items: center; }
  #tools label { display: inline-flex; align-items: center; gap: 5px; color: var(--btnfg); font: 500 11px 'IBM Plex Sans', system-ui, sans-serif;
                 background: var(--btnbg); border: 1px solid var(--btnbd); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #tools input[type=color] { width: 18px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; }
  #tools input[type=checkbox] { margin: 0; cursor: pointer; }
  #tools button {
    background: var(--btnbg); color: var(--btnfg); border: 1px solid var(--btnbd); border-radius: 4px; cursor: pointer;
    font: 500 11px 'IBM Plex Sans', system-ui, sans-serif; padding: 4px 9px;
  }
  #tools button:hover { border-color: #3b82f6; color: var(--fg); }
  #tools button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }
  #gx { position: absolute; right: 8px; left: 8px; top: 0; height: 30px; z-index: 7; display: none; gap: 6px; align-items: center; justify-content: flex-end; }
  #gx .ttl { margin-right: auto; color: var(--muted); font: 600 11px 'IBM Plex Sans', system-ui, sans-serif; letter-spacing: .04em; }
  #gx .seg { display: inline-flex; border: 1px solid var(--btnbd); border-radius: 5px; overflow: hidden; }
  #gx button, #gx select { background: var(--btnbg); color: var(--btnfg); border: 0; font: 500 11px 'IBM Plex Sans', system-ui, sans-serif; padding: 5px 10px; cursor: pointer; }
  #gx .seg button + button { border-left: 1px solid var(--btnbd); }
  #gx button.on { background: #1d3a6b; color: #fff; }
  #gx .solo { border: 1px solid var(--btnbd); border-radius: 5px; }
  #gx select { border: 1px solid var(--btnbd); border-radius: 5px; padding: 5px 8px; }
  #cd { position: absolute; right: var(--pw); z-index: 6; display: none; text-align: center; box-sizing: border-box;
        font: 500 11px/17px 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; color: #fff; pointer-events: none; border-radius: 2px; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         color: #ef9a9a; font: 500 14px 'IBM Plex Sans', sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="chart"></div>
  <div id="side"><canvas id="gxc"></canvas></div>
  <div id="legend"></div>
  <div id="tools"><button id="btn-fit" title="Повернутися до поточного часу">До поточного</button><button id="btn-reset" title="Скинути масштаб">Скинути</button>
    <label id="ib-ctl" title="Показати/сховати зону Initial Balance і змінити колір" style="display:none"><input type="checkbox" id="ib-on"> IB <input type="color" id="ib-col" value="#4c8dff"></label></div>
  <div id="gx"><span class="ttl" id="gx-t"></span><div class="seg"><button id="gx-all" class="on">Усі серії</button><button id="gx-0">0DTE</button></div>
    <button id="gx-sum" class="solo">Σ крива</button>
    <select id="gx-m"><option value="net">Net GEX</option><option value="call">Call GEX</option><option value="put">Put GEX</option><option value="abs">Call + Put</option></select></div>
  <div id="cd" title="Час до закриття свічки"></div>
  <div id="err"></div>
</div>
<script>__LIB__</script>
<script>
(function () {
  const INLINE = __PAYLOAD__;
  const POLL_KEY = __POLLKEY__;
  const showErr = (m) => { const e = document.getElementById('err'); e.style.display = 'flex'; e.textContent = m; };
  if (!window.LightweightCharts) { showErr('Не вдалося завантажити бібліотеку графіка.'); return; }
  const LW = window.LightweightCharts;
  let gen = 0, cleanup = null, liveApply = null, liveCfg = null;

  // ---- Живі тики LSE прямо в браузері (свічка рухається як у TradingView, без перезавантаження сторінки)
  let ws = null, wsKey = '', wsStop = false;
  let fmtK;
  try { fmtK = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Kyiv', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  catch (e) { fmtK = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Kiev', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  const kyivWall = (ts) => { const p = {}; fmtK.formatToParts(new Date(ts * 1000)).forEach((x) => { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) / 1000; };
  function ensureWs(L) {
    const k = L ? L.symbol + '|' + L.key : '';
    if (k === wsKey) return;
    wsKey = k; wsStop = true; try { if (ws) ws.close(); } catch (e) {} ws = null;
    if (!L) return;
    wsStop = false;
    const open = () => {
      if (wsStop || wsKey !== k) return;
      let w; try { w = new WebSocket(L.url); } catch (e) { return; }
      ws = w;
      w.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'welcome') w.send(JSON.stringify({ action: 'auth', api_key: L.key }));
        else if (m.type === 'authenticated') w.send(JSON.stringify({ action: 'subscribe', symbol: L.symbol }));
        else if (m.type === 'tick' && !m.replay && m.symbol === L.symbol && liveApply) {
          const ts = Date.parse(m.ts) / 1000; if (!isFinite(ts)) return;
          try { liveApply(+m.price, +(m.volume || 0), kyivWall(ts)); } catch (e) {}
        }
      };
      w.onclose = () => { if (!wsStop && wsKey === k) setTimeout(open, 3000); };
      w.onerror = () => { try { w.close(); } catch (e) {} };
    };
    open();
  }

  function build(P) {
  gen += 1; const g = gen;
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  liveApply = null; let liveCur = null, extra = 0;
  document.getElementById('err').style.display = 'none';
  ['side', 'gx'].forEach((i) => { document.getElementById(i).style.display = 'none'; });
  document.getElementById('ib-ctl').style.display = 'none';
  document.getElementById('wrap').style.setProperty('--top', '0px'); document.getElementById('wrap').style.setProperty('--pw', '0px');
  // Тема: беремо фон сторінки Streamlit (якщо iframe має доступ), інакше підказка з Python або системна
  function parseRgb(c) { const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || ''); return m ? [+m[1], +m[2], +m[3]] : null; }
  let pageBg = null, dark = P.theme !== 'light';
  try {
    const app = window.parent.document.querySelector('.stApp') || window.parent.document.body;
    const rgb = parseRgb(window.parent.getComputedStyle(app).backgroundColor);
    if (rgb) { pageBg = 'rgb(' + rgb.join(',') + ')'; dark = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) < 140; }
  } catch (e) {
    if (window.matchMedia && !P.theme) dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  const T = dark
    ? { bg: pageBg || '#0a0f18', fg: '#d8e0ee', muted: '#8b97b1', line: '#1e2a3f', grid: 'rgba(30,42,63,0.5)', cross: '#52617f', btnbg: '#101827', btnfg: '#aab6cf', btnbd: '#263451', sep: '#33466b' }
    : { bg: pageBg || '#f5f7fb', fg: '#1b2333', muted: '#5b6882', line: '#d5dcea', grid: 'rgba(120,135,165,0.2)', cross: '#8c9ab5', btnbg: '#ffffff', btnfg: '#42506b', btnbd: '#cfd7e6', sep: '#b9c4da' };
  const rs = document.documentElement.style;
  rs.setProperty('--bg', T.bg); rs.setProperty('--fg', T.fg); rs.setProperty('--muted', T.muted); rs.setProperty('--line', T.line);
  rs.setProperty('--btnbg', T.btnbg); rs.setProperty('--btnfg', T.btnfg); rs.setProperty('--btnbd', T.btnbd);
  const LT = { EN: { fit: 'Go to latest', fitT: 'Back to current time', reset: 'Reset', resetT: 'Reset zoom', all: 'All series', sum: 'Σ curve', zero: '0DTE', allT: 'ALL SERIES' },
               RU: { fit: 'К текущему', fitT: 'Вернуться к текущему времени', reset: 'Сбросить', resetT: 'Сбросить масштаб', all: 'Все серии', sum: 'Σ кривая', zero: '0DTE', allT: 'ВСЕ СЕРИИ' } }[P.lang] || null;
  const setTxt = (id, v, t) => { const n = document.getElementById(id); if (n) { n.textContent = v; if (t) n.title = t; } };
  if (LT) { setTxt('btn-fit', LT.fit, LT.fitT); setTxt('btn-reset', LT.reset, LT.resetT); setTxt('gx-all', LT.all); setTxt('gx-sum', LT.sum); }
  else { setTxt('btn-fit', 'До поточного', 'Повернутися до поточного часу'); setTxt('btn-reset', 'Скинути', 'Скинути масштаб'); setTxt('gx-all', 'Усі серії'); setTxt('gx-sum', 'Σ крива'); }
  const el = document.getElementById('chart');
  const FONT = "'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";

  const chart = LW.createChart(el, {
    autoSize: true,
    layout: {
      background: { type: 'solid', color: T.bg }, textColor: T.muted, fontFamily: FONT, fontSize: 11,
      panes: { separatorColor: T.line, separatorHoverColor: T.sep, enableResize: true },
    },
    grid: { vertLines: { color: T.grid }, horzLines: { color: T.grid } },
    crosshair: {
      mode: LW.CrosshairMode.Normal,
      vertLine: { color: T.cross, labelBackgroundColor: dark ? '#1e2a3f' : '#42506b' },
      horzLine: { color: T.cross, labelBackgroundColor: dark ? '#1e2a3f' : '#42506b' },
    },
    rightPriceScale: { borderColor: T.line, scaleMargins: { top: 0.06, bottom: 0.08 } },
    timeScale: { borderColor: T.line, timeVisible: !P.daily, secondsVisible: false, rightOffset: 14, barSpacing: P.bar_spacing || 7, minBarSpacing: 1.5 },
    localization: { priceFormatter: (p) => p.toFixed(2) },
    handleScale: { axisPressedMouseMove: { time: true, price: true }, mouseWheel: true, pinch: true },
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
  });

  // ---- Свічки і обсяг (панель 0)
  const candles = chart.addSeries(LW.CandlestickSeries, {
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    priceFormat: { type: 'price', precision: 2, minMove: 0.25 },
    lastValueVisible: !P.cd_sec,     // за наявності таймера останню ціну малюємо власною міткою разом із відліком
  }, 0);
  candles.setData(P.candles);

  // ---- VWAP (сесійний) з ±1σ
  (P.vwap || []).forEach((s) => {
    const mk = (data, color, w, style) => {
      if (!data || !data.length) return;
      const l = chart.addSeries(LW.LineSeries, {
        color, lineWidth: w, lineStyle: style, priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      }, 0);
      l.setData(data);
    };
    mk(s.u, 'rgba(143,163,200,0.45)', 1, 2);
    mk(s.l, 'rgba(143,163,200,0.45)', 1, 2);
    mk(s.v, '#8fa3c8', 2, 0);
  });

  // ---- Горизонтальні рівні
  (P.levels || []).forEach((lv) => {
    candles.createPriceLine({
      price: lv.price, color: lv.color, lineWidth: lv.width || 1, lineStyle: lv.style ?? 2,
      axisLabelVisible: true, title: lv.title,
    });
  });

  // ---- Зона Initial Balance: напівпрозорий прямокутник між IBL і IBH
  const IBK = 'ashelper:ib';
  let ibState = { on: true, color: '#4c8dff' };
  try { const sv = JSON.parse(localStorage.getItem(IBK) || 'null'); if (sv) ibState = Object.assign(ibState, sv); } catch (e) {}
  const hexA = (hex, a) => { const m = /#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(hex) || []; return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`; };
  class IbRenderer {
    constructor(src) { this.s = src; }
    draw(target) {
      const s = this.s;
      if (!s.ib || !ibState.on || !s.series) return;
      const ts = chart.timeScale();
      const x0 = ts.timeToCoordinate(s.ib.t0), x1 = ts.timeToCoordinate(s.ib.t1);
      const yh = s.series.priceToCoordinate(s.ib.hi), yl = s.series.priceToCoordinate(s.ib.lo);
      if (yh == null || yl == null) return;
      target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
        const xa = x0 == null ? 0 : x0, xb = (x1 == null ? mediaSize.width : x1) + 8;
        ctx.fillStyle = hexA(ibState.color, 0.16);
        ctx.fillRect(xa, Math.min(yh, yl), xb - xa, Math.abs(yl - yh));
        ctx.strokeStyle = hexA(ibState.color, 0.65); ctx.lineWidth = 1;
        ctx.strokeRect(xa + 0.5, Math.min(yh, yl) + 0.5, xb - xa, Math.abs(yl - yh));
        ctx.fillStyle = hexA(ibState.color, 0.95); ctx.font = "600 10px 'IBM Plex Sans', sans-serif";
        ctx.fillText('IB', xa + 4, Math.min(yh, yl) + 12);
      });
    }
  }
  class IbView { constructor(s) { this.s = s; } zOrder() { return 'bottom'; } renderer() { return new IbRenderer(this.s); } }
  class IbPrimitive {
    constructor(ib) { this.ib = ib; this.series = null; this.req = null; }
    attached(p) { this.series = p.series; this.req = p.requestUpdate; }
    detached() { this.series = null; }
    updateAllViews() {}
    paneViews() { return [new IbView(this)]; }
    refresh() { if (this.req) this.req(); }
  }
  let ibPrim = null;
  if (P.ib_available) {
    const ctl = document.getElementById('ib-ctl'); ctl.style.display = 'inline-flex';
    const on = document.getElementById('ib-on'), col = document.getElementById('ib-col');
    on.checked = ibState.on; col.value = ibState.color;
    const save = () => { try { localStorage.setItem(IBK, JSON.stringify(ibState)); } catch (e) {} if (ibPrim) ibPrim.refresh(); };
    on.onchange = () => { ibState.on = on.checked; save(); };
    col.oninput = () => { ibState.color = col.value; save(); };
    if (P.ib) { try { ibPrim = new IbPrimitive(P.ib); candles.attachPrimitive(ibPrim); } catch (e) { console.warn('ib primitive failed', e); } }
  }

  // ---- GEX за страйками: окремий віджет праворуч від графіка, вирівняний по тій самій ціновій шкалі
  const GXK = 'ashelper:gx';
  const gxs = { scope: 'all', sum: false, m: 'net' };
  try { Object.assign(gxs, JSON.parse(localStorage.getItem(GXK) || '{}')); } catch (e) {}
  const gxVal = (r) => {
    const z = gxs.scope === '0', c = z ? r.zc : r.c, p = z ? r.zp : r.p, n = z ? r.z : r.v;
    return gxs.m === 'call' ? c : gxs.m === 'put' ? -p : gxs.m === 'abs' ? c + p : n;
  };
  const fmtB = (v) => { const a = Math.abs(v), sg = v < 0 ? '−' : '+';
    return a >= 1 ? sg + a.toFixed(2) + 'B' : a >= 0.001 ? sg + (a * 1000).toFixed(a >= 0.1 ? 0 : 1) + 'M' : sg + (a * 1e6).toFixed(0) + 'k'; };
  const gxTitle = () => ({ net: 'NET GEX', call: 'CALL GEX', put: 'PUT GEX', abs: 'CALL + PUT GEX' }[gxs.m]) + (gxs.scope === '0' ? ' · 0DTE' : ' · ' + (LT ? LT.allT : 'УСІ СЕРІЇ')) + ' · $/1%';
  try {
    if (P.profile && P.profile.length) {
      const wrap = document.getElementById('wrap'), side = document.getElementById('side'), cv = document.getElementById('gxc');
      const box = document.getElementById('gx'), ttl = document.getElementById('gx-t');
      const PW = Math.round(Math.max(170, Math.min(250, window.innerWidth * 0.2)));
      wrap.style.setProperty('--top', '30px'); wrap.style.setProperty('--pw', PW + 'px');
      side.style.display = 'block'; box.style.display = 'flex';
      const rows = P.profile;
      let lastSig = '';
      const draw = (force) => {
        const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
        let ph = h; try { ph = chart.panes()[0].getHeight(); } catch (e) {}
        const ys = rows.map((r) => candles.priceToCoordinate(r.price));
        const sig = [w, h, ph, ys[0], ys[ys.length - 1], gxs.scope, gxs.sum, gxs.m, liveCur ? liveCur.close : 0].join('|');
        if (!force && sig === lastSig) return;
        lastSig = sig;
        const dpr = window.devicePixelRatio || 1;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
        const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h); ctx.fillStyle = T.bg; ctx.fillRect(0, 0, w, h);
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, ph); ctx.clip();
        const vals = rows.map(gxVal);
        const mx = Math.max(1e-9, ...vals.map((v) => Math.abs(v)));
        let step = 8;
        for (let i = 1; i < ys.length; i++) { if (ys[i] != null && ys[i - 1] != null) { step = Math.abs(ys[i] - ys[i - 1]); break; } }
        const bh = Math.max(2, Math.min(step - 1.5, 15));
        const hasNeg = vals.some((v) => v < 0), hasPos = vals.some((v) => v > 0);
        const x0 = hasNeg && hasPos ? Math.round(w * 0.5) : hasNeg ? w - 6 : 6;   // нульова вісь
        const span = (hasNeg && hasPos ? w * 0.5 : w) - 54;
        const top = new Set([...vals.keys()].sort((a, b) => Math.abs(vals[b]) - Math.abs(vals[a])).slice(0, 12));
        ctx.font = "500 10px 'IBM Plex Mono', monospace";
        // поточна ціна
        const last = liveCur || P.candles[P.candles.length - 1], yl = candles.priceToCoordinate(last.close);
        if (yl != null) { ctx.strokeStyle = 'rgba(120,140,180,0.45)'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(0, yl); ctx.lineTo(w, yl); ctx.stroke(); ctx.setLineDash([]); }
        rows.forEach((r, i) => {
          const y = ys[i], v = vals[i];
          if (y == null || y < -10 || y > ph + 10 || !isFinite(v) || v === 0) return;
          const len = Math.max(1, Math.abs(v) / mx * span);
          const pos = v >= 0;
          const xs = pos ? x0 : x0 - len;
          ctx.fillStyle = pos ? 'rgba(38,166,154,0.85)' : 'rgba(239,83,80,0.85)';
          ctx.fillRect(xs, y - bh / 2, len, bh);
          if (bh >= 7 && (step >= 10 || top.has(i)) && Math.abs(v) / mx > 0.02) {
            ctx.fillStyle = T.muted; ctx.textAlign = pos ? 'left' : 'right';
            ctx.fillText(fmtB(v), pos ? x0 + len + 4 : x0 - len - 4, y + 3.5);
          }
        });
        if (hasNeg && hasPos) { ctx.strokeStyle = T.line; ctx.beginPath(); ctx.moveTo(x0 + 0.5, 0); ctx.lineTo(x0 + 0.5, ph); ctx.stroke(); }
        if (gxs.sum) {   // Σ-крива: накопичена гамма знизу вгору; перетин нульової осі = HVL
          let acc = 0; const pts = [];
          rows.map((r, i) => i).filter((i) => ys[i] != null).sort((a, b) => ys[b] - ys[a]).forEach((i) => { acc += vals[i]; pts.push([ys[i], acc]); });
          const m2 = Math.max(1e-9, ...pts.map((q) => Math.abs(q[1])));
          const amp = hasNeg && hasPos ? w * 0.5 - 8 : w - 14;
          ctx.beginPath(); pts.forEach((q, k) => { const x = x0 + q[1] / m2 * amp; k ? ctx.lineTo(x, q[0]) : ctx.moveTo(x, q[0]); });
          ctx.strokeStyle = '#f5a524'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.lineWidth = 1;
        }
        ctx.restore();
      };
      const sync = () => {
        document.getElementById('gx-all').classList.toggle('on', gxs.scope === 'all');
        document.getElementById('gx-0').classList.toggle('on', gxs.scope === '0');
        document.getElementById('gx-sum').classList.toggle('on', gxs.sum);
        document.getElementById('gx-m').value = gxs.m; ttl.textContent = gxTitle();
        try { localStorage.setItem(GXK, JSON.stringify(gxs)); } catch (e) {}
        draw(true);
      };
      document.getElementById('gx-all').onclick = () => { gxs.scope = 'all'; sync(); };
      document.getElementById('gx-0').onclick = () => { gxs.scope = '0'; sync(); };
      document.getElementById('gx-sum').onclick = () => { gxs.sum = !gxs.sum; sync(); };
      document.getElementById('gx-m').onchange = (e) => { gxs.m = e.target.value; sync(); };
      const loop = () => { if (g !== gen) return; try { draw(false); } catch (e) {} requestAnimationFrame(loop); };
      sync(); requestAnimationFrame(loop);
    }
  } catch (e) { console.warn('gex widget failed', e); }

  const fmtVol = (v) => {
    const a = Math.abs(v), sg = v < 0 ? '-' : '';
    if (a >= 1e6) return sg + (a / 1e6).toFixed(2) + 'M';
    if (a >= 1e3) return sg + (a / 1e3).toFixed(1) + 'K';
    return sg + a.toFixed(0);
  };
  // ---- Нижні панелі: CVD (лінія, скидання на кожній сесії), Delta і Volume (як у NinjaTrader/Sierra)
  let pane = 1, lastCvd = null;
  const stretch = [3.6];
  if (P.cvd && P.cvd.length) {
    P.cvd.forEach((data, i) => {
      const isLast = i === P.cvd.length - 1;
      const l = chart.addSeries(LW.LineSeries, {
        color: isLast ? '#6aa9ff' : 'rgba(106,169,255,0.4)', lineWidth: isLast ? 2 : 1,
        priceFormat: { type: 'custom', minMove: 1, formatter: fmtVol }, lastValueVisible: isLast, priceLineVisible: false,
        crosshairMarkerVisible: false, title: isLast ? (P.cvd_exact ? 'CVD' : 'CVD~') : '',
      }, pane);
      l.setData(data);
      if (isLast) lastCvd = l;
    });
    if (lastCvd) lastCvd.createPriceLine({ price: 0, color: T.sep, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '' });
    stretch.push(1.1); pane += 1;
    if (P.delta && P.delta.length) {
      const dl = chart.addSeries(LW.HistogramSeries, {
        priceFormat: { type: 'custom', minMove: 1, formatter: fmtVol }, lastValueVisible: true, priceLineVisible: false, title: 'Delta',
      }, pane);
      dl.setData(P.delta); stretch.push(0.7); pane += 1;
    }
  }
  const vs = chart.addSeries(LW.HistogramSeries, {
    priceFormat: { type: 'custom', minMove: 1, formatter: fmtVol }, lastValueVisible: true, priceLineVisible: false, title: 'Vol',
  }, pane);
  vs.setData(P.volume); stretch.push(0.7);
  try {
    const panes = chart.panes();
    stretch.forEach((f, i) => { if (panes[i]) panes[i].setStretchFactor(f); });
  } catch (e) { console.warn('pane sizing failed', e); }

  // ---- Легенда
  const legend = document.getElementById('legend');
  const fmt = (v) => v.toFixed(2);
  function renderLegend(bar) {
    if (!bar) { legend.innerHTML = `<span class="t">${P.title}</span>`; return; }
    const up = bar.close >= bar.open, cls = up ? 'up' : 'dn';
    const chg = bar.close - bar.open;
    legend.innerHTML = `<span class="t">${P.title}</span>`
      + `O <b>${fmt(bar.open)}</b> H <b>${fmt(bar.high)}</b> L <b>${fmt(bar.low)}</b> C <b>${fmt(bar.close)}</b> `
      + `<span class="${cls}">${chg >= 0 ? '+' : ''}${fmt(chg)}</span>`;
  }
  let lastBar = P.candles[P.candles.length - 1], hover = false;
  renderLegend(lastBar);
  chart.subscribeCrosshairMove((param) => {
    const bar = param && param.seriesData ? param.seriesData.get(candles) : null;
    hover = !!bar;
    renderLegend(bar || lastBar);
  });

  // ---- Масштаб: зберігаємо відносно останньої свічки, щоб автооновлення не скидало перегляд
  const KEY = 'ashelper:view:' + P.key;
  const lastIdx = P.candles.length - 1;
  const defRange = () => ({ from: Math.max(0, lastIdx - P.default_bars), to: lastIdx + 14 });
  let range = defRange();
  try {
    const sv = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (sv && isFinite(sv.f) && isFinite(sv.t) && sv.t - sv.f > 8 && sv.t - sv.f < 4000) range = { from: lastIdx + sv.f, to: lastIdx + sv.t };
  } catch (e) {}
  chart.timeScale().setVisibleLogicalRange(range);
  chart.timeScale().subscribeVisibleLogicalRangeChange((r) => {
    if (!r) return;
    try { localStorage.setItem(KEY, JSON.stringify({ f: r.from - lastIdx - extra, t: r.to - lastIdx - extra })); } catch (e) {}
  });
  document.getElementById('btn-fit').onclick = () => chart.timeScale().scrollToRealTime();
  document.getElementById('btn-reset').onclick = () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    chart.timeScale().setVisibleLogicalRange(defRange());
    chart.priceScale('right').applyOptions({ autoScale: true });
  };
  window.__chart = chart; window.__candles = candles; window.__ready = true; window.__cur = () => liveCur;

  // ---- Живе оновлення останньої свічки й обсягу з тиків (лише внутрішньоденні ТФ)
  const L = P.live;
  if (L && L.tf_sec && !P.daily && P.candles.length) {
    const tfs = L.tf_sec, lv = {};
    const lastC = P.candles[P.candles.length - 1], lastV = P.volume.length ? P.volume[P.volume.length - 1] : null;
    let cur = { time: lastC.time, open: lastC.open, high: lastC.high, low: lastC.low, close: lastC.close };
    let baseVol = lastV && lastV.time === lastC.time ? lastV.value : 0;
    liveCur = cur;
    liveApply = (price, size, wall) => {
      const b = Math.floor(wall / tfs) * tfs;
      if (b < cur.time || !isFinite(price) || price <= 0) return;
      lv[b] = (lv[b] || 0) + (size || 0);
      if (b === cur.time) { cur.high = Math.max(cur.high, price); cur.low = Math.min(cur.low, price); cur.close = price; }
      else { cur = { time: b, open: price, high: price, low: price, close: price }; baseVol = 0; extra += 1; }
      liveCur = cur;
      candles.update(cur);
      const v = Math.max(baseVol, lv[b] || 0);
      vs.update({ time: b, value: v, color: cur.close >= cur.open ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)' });
      lastBar = cur; if (!hover) renderLegend(cur);
    };
  }
  ensureWs(L && L.tf_sec && !P.daily ? L : null);
  // ---- Таймер до закриття свічки під останньою ціною на шкалі (як у TradingView)
  const cdEl = document.getElementById('cd'); cdEl.style.display = 'none';
  let cdTimer = null;
  if (P.cd_sec && P.candles.length) {
    const tfs = P.cd_sec;
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const tick = () => {
      const last = liveCur || P.candles[P.candles.length - 1];
      const wall = kyivWall(Date.now() / 1000);
      let end = last.time + tfs;
      if (wall - end > tfs * 3) { cdEl.style.display = 'none'; return; }       // ринок закритий: свічки не йдуть
      while (end <= wall) end += tfs;
      const rem = Math.max(0, end - wall);
      const h = Math.floor(rem / 3600), m = Math.floor((rem % 3600) / 60), sec = rem % 60;
      cdEl.innerHTML = '<div>' + last.close.toFixed(2) + '</div><div style="opacity:.92">' + (h ? h + ':' + pad(m) + ':' + pad(sec) : pad(m) + ':' + pad(sec)) + '</div>';
      const y = candles.priceToCoordinate(last.close);
      let pw = 56; try { pw = chart.priceScale('right').width() || 56; } catch (e) {}
      if (y == null) { cdEl.style.display = 'none'; return; }
      cdEl.style.width = pw + 'px';
      cdEl.style.background = last.close >= last.open ? '#26a69a' : '#ef5350';
      cdEl.style.top = 'calc(var(--top) + ' + Math.round(y - 9) + 'px)';
      cdEl.style.display = 'block';
    };
    tick(); cdTimer = setInterval(tick, 500);
  }
  cleanup = () => { if (cdTimer) clearInterval(cdTimer); try { chart.remove(); } catch (e) {} };
  }

  // ---- Запуск: або дані вшиті в сторінку, або сторінка стабільна і бере дані з сусіднього невидимого фрейму
  if (INLINE) { build(INLINE); }
  else {
    let ver = null;
    const poll = () => {
      let d = null;
      try { d = window.parent.__ASH && window.parent.__ASH[POLL_KEY]; }
      catch (e) { showErr('Немає доступу до даних графіка (батьківська сторінка).'); return; }
      if (d && d.v !== ver) { ver = d.v; try { build(JSON.parse(d.j)); } catch (e) { console.error(e); showErr('Помилка побудови графіка: ' + e.message); } }
    };
    poll(); setInterval(poll, 400);
  }
})();
</script>
</body>
</html>
